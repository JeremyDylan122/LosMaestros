name: losmaestros-aws

x-java: &java
  restart: unless-stopped
  mem_limit: 768m
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  mysql-usuarios:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 512m
    command: ["--innodb-buffer-pool-size=128M", "--max-connections=60", "--performance-schema=OFF", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_DATABASE: losmaestros_usuarios
      MYSQL_USER: lm_usuarios
      MYSQL_PASSWORD: ${USUARIOS_DB_PASSWORD:?Ejecuta preparar.sh}
      MYSQL_ROOT_PASSWORD: ${USUARIOS_DB_ROOT_PASSWORD:?Ejecuta preparar.sh}
    volumes:
      - usuarios_data:/var/lib/mysql
      - ../backend/usuarios-service/database/usuarios-mysql.sql:/docker-entrypoint-initdb.d/10-usuarios.sql:ro
    networks: [usuarios_db]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1 FROM usuarios LIMIT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  mysql-ventas:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 512m
    command: ["--innodb-buffer-pool-size=128M", "--max-connections=60", "--performance-schema=OFF", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_DATABASE: losmaestros_ventas
      MYSQL_USER: lm_ventas
      MYSQL_PASSWORD: ${VENTAS_DB_PASSWORD:?Ejecuta preparar.sh}
      MYSQL_ROOT_PASSWORD: ${VENTAS_DB_ROOT_PASSWORD:?Ejecuta preparar.sh}
    volumes:
      - ventas_data:/var/lib/mysql
      - ../backend/ventas-service/database/jeremy-catalogo-mysql.sql:/docker-entrypoint-initdb.d/10-catalogo.sql:ro
      - ../backend/ventas-service/database/seba-mysql.sql:/docker-entrypoint-initdb.d/20-pedidos.sql:ro
    networks: [ventas_db]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1 FROM productos LIMIT 1; SELECT 1 FROM pedidos LIMIT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  usuarios:
    <<: *java
    build: ../backend/usuarios-service
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SERVER_PORT: "8081"
      DB_URL: jdbc:mysql://mysql-usuarios:3306/losmaestros_usuarios?allowPublicKeyRetrieval=true&useSSL=false&characterEncoding=UTF-8
      DB_USERNAME: lm_usuarios
      DB_PASSWORD: ${USUARIOS_DB_PASSWORD:?Ejecuta preparar.sh}
      USUARIOS_ADMIN_PASSWORD: ${USUARIOS_ADMIN_PASSWORD:?Ejecuta preparar.sh}
      USUARIOS_JWT_PUBLIC_KEY_LOCATION: file:/run/secrets/jwt_public
      USUARIOS_JWT_PRIVATE_KEY_LOCATION: file:/run/secrets/jwt_private
      USUARIOS_INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Ejecuta preparar.sh}
      APP_CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?Define la URL del navegador}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65 -Duser.timezone=America/Santiago
    secrets: [jwt_private, jwt_public]
    networks: [web, usuarios_db]
    depends_on:
      mysql-usuarios: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://localhost:8081/v3/api-docs"]
      interval: 15s
      timeout: 6s
      retries: 20
      start_period: 60s

  ventas:
    <<: *java
    build: ../backend/ventas-service
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SERVER_PORT: "8082"
      DB_URL: jdbc:mysql://mysql-ventas:3306/losmaestros_ventas?allowPublicKeyRetrieval=true&useSSL=false&characterEncoding=UTF-8
      DB_USERNAME: lm_ventas
      DB_PASSWORD: ${VENTAS_DB_PASSWORD:?Ejecuta preparar.sh}
      VENTAS_JWT_PUBLIC_KEY_LOCATION: file:/run/secrets/jwt_public
      VENTAS_USUARIOS_URL: http://usuarios:8081
      VENTAS_USUARIOS_INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Ejecuta preparar.sh}
      APP_CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?Define la URL del navegador}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65 -Duser.timezone=America/Santiago
    secrets: [jwt_public]
    networks: [web, ventas_db]
    depends_on:
      mysql-ventas: {condition: service_healthy}
      usuarios: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://localhost:8082/v3/api-docs"]
      interval: 15s
      timeout: 6s
      retries: 20
      start_period: 60s

  frontend:
    restart: unless-stopped
    mem_limit: 128m
    build:
      context: ../frontend
      args:
        VITE_API_USUARIOS_URL: /usuarios/api/v1
        VITE_API_VENTAS_URL: /ventas/api/v1
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    networks: [web]
    depends_on:
      usuarios: {condition: service_healthy}
      ventas: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  web:
  usuarios_db:
    internal: true
  ventas_db:
    internal: true

volumes:
  usuarios_data:
  ventas_data:

secrets:
  jwt_private:
    file: ./secrets/jwt-private.pem
  jwt_public:
    file: ./secrets/jwt-public.pem
