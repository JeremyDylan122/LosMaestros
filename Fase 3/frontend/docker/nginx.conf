resolver 127.0.0.11 valid=10s ipv6=off;

upstream usuarios_backend {
    zone usuarios_backend 64k;
    server usuarios:8081 resolve;
}

upstream ventas_backend {
    zone ventas_backend 64k;
    server ventas:8082 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # Solo Ventas consulta este canal dentro de la red de contenedores.
    location ^~ /usuarios/api/v1/interno {
        return 404;
    }

    location ^~ /usuarios/api/ {
        proxy_pass http://usuarios_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location ^~ /ventas/api/ {
        proxy_pass http://ventas_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Una ruta API incorrecta debe devolver error, nunca el HTML de React.
    location ~ ^/(usuarios|ventas)/ {
        return 404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control 'no-cache';
        try_files $uri $uri/ /index.html;
    }
}
